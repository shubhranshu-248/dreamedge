name: mobile
description: "Dream Edge - Online Education Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI & utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.19.0

  # Storage
  shared_preferences: ">=2.5.3 <4.0.0"
  flutter_secure_storage: ^9.2.4

  # Connectivity
  connectivity_plus: ^6.1.4

  # URL launcher
  url_launcher: ^6.3.1

  # Video player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Firebase & notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Payments
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  riverpod_lint: ^2.6.3
  custom_lint: ^0.7.5
  mockito: ^5.4.4

dependency_overrides:
  shared_preferences_android: 2.4.0

flutter:
  uses-material-design: true
